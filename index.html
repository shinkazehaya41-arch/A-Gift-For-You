<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Gift For You 💌</title>
  <meta name="description" content="A little surprise made with love." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>" />
</head>
<body>
  <div class="petal-layer" id="petalLayer" aria-hidden="true"></div>

  <!-- ============ SCREEN 1 : GREETING ============ -->
  <section class="screen active" id="s1">
    <div class="portrait">
      <div class="photo-slot round">
        <span class="ph">🐱</span>
        <img src="images/photo1.jpg" alt="Your picture"
             onerror="this.parentElement.classList.add('empty');this.remove();" />
      </div>

      <h1 class="title" id="greetTitle">HI MY BABY!</h1>
      <p class="sub" id="greetSub">Would you like to see your gift?</p>

      <div class="btn-row">
        <button class="circle-btn" id="noBtn" aria-label="No">✕</button>
        <button class="circle-btn" id="yesBtn" aria-label="Yes">✓</button>
      </div>
    </div>
  </section>

  <!-- ============ SCREEN 2 : FLOWERS ============ -->
  <section class="screen" id="s2">
    <div class="portrait">
      <h2 class="script" id="flowersTitle">Flowers for you</h2>
      <p class="sub" id="flowersSub">Click the letter for a surprise</p>

      <div class="bouquet" id="bouquet" role="button" tabindex="0" aria-label="Open the letter">
        <img class="bouquet-photo" src="images/flowers.jpg" alt="Flowers"
             onerror="this.remove();" />
        <div class="roses" aria-hidden="true">
          <span class="rose r-a">🌷</span>
          <span class="rose r-b">🌷</span>
          <span class="rose r-c">🌷</span>
        </div>
        <div class="stems" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="vase">
          <span id="vaseLine1">I'M SORRY</span>
          <span id="vaseLine2">I LOVE YOU</span>
        </div>
      </div>

      <button class="pill" id="letterBtn">💌 Open the letter</button>
      <button class="back-mini" id="backFromS2" aria-label="Back">←</button>
    </div>
  </section>

  <!-- ============ SCREEN 3 : AW PLEASE ============ -->
  <section class="screen" id="s3">
    <div class="portrait">
      <div class="photo-slot wide">
        <span class="ph">🐾</span>
        <img src="images/photo2.jpg" alt="Your picture"
             onerror="this.parentElement.classList.add('empty');this.remove();" />
      </div>

      <h1 class="title" id="pleaseTitle">AW PLEASE?</h1>
      <p class="sub" id="pleaseSub">I prepared this gift for you</p>

      <button class="circle-btn" id="backBtn" aria-label="Back">←</button>
    </div>
  </section>

  <!-- ============ SCREEN 4 : THE LETTER ============ -->
  <section class="screen" id="s4">
    <div class="portrait letter-page">
      <h2 class="script" id="letterTitle">I'm sorry my love</h2>

      <figure class="letter-photo">
        <span class="ph">🖼️<small>Add images/photo3.jpg</small></span>
        <img src="images/photo3.jpg" alt="A memory"
             onerror="this.parentElement.classList.add('empty');this.remove();" />
      </figure>

      <p class="letter-body" id="letterBody"></p>

      <div class="mini-gallery">
        <figure class="shot">
          <span class="ph">📸<small>photo4.jpg</small></span>
          <img src="images/photo4.jpg" alt="Memory"
               onerror="this.parentElement.classList.add('empty');this.remove();" />
        </figure>
      </div>

      <p class="the-end" id="theEnd">The end… but only the beginning ❤️</p>

      <div class="end-row">
        <button class="pill" id="restartBtn">🔄 Start again</button>
        <button class="pill ghost" id="backFromS4">← Back</button>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
